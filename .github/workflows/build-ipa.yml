name: Build Native Switch IPA (A16 Fork)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name on Home Screen'
        required: true
        default: 'Zelda BotW'
        type: string
      base_rom_url:
        description: 'Google Drive Link for Base Game (.nsp / .nsz / .zip)'
        required: true
        type: string
      update_rom_url:
        description: 'Google Drive Link for Update 1.9.0 (.nsp / .nsz / .zip)'
        required: false
        type: string
      keys_url:
        description: 'Direct Raw URL for prod.keys (e.g. Gist Raw URL)'
        required: true
        type: string
      split_romfs:
        description: 'Split RomFS from IPA? (Keep true for BotW)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build_native_ipa:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app /Library/Developer/CommandLineTools /usr/local/share/android* || true
          df -h

      - name: Checkout A16-Patched nxnative (BC-to-ASTC Fork)
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          submodules: recursive

      - name: Install Xcode Metal Toolchain & Dependencies
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang sevenzip
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages gdown lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Download Keys & NSP Files
        run: |
          mkdir -p "$RUNNER_TEMP/game" "$RUNNER_TEMP/keys"
          curl -L "${{ inputs.keys_url }}" -o "$RUNNER_TEMP/keys/prod.keys"
          head -n 3 "$RUNNER_TEMP/keys/prod.keys" | grep -q "=" || (echo "Invalid prod.keys URL!" && exit 1)

          cd "$RUNNER_TEMP/game"
          echo "Downloading Base Game..."
          BASE_ID=$(echo "${{ inputs.base_rom_url }}" | sed -n 's/.*\/d\/\([^/?]*\).*/\1/p')
          if [ -n "$BASE_ID" ]; then
            gdown "$BASE_ID"
          else
            gdown "${{ inputs.base_rom_url }}"
          fi

          if [ -n "${{ inputs.update_rom_url }}" ]; then
            echo "Downloading Update..."
            UPD_ID=$(echo "${{ inputs.update_rom_url }}" | sed -n 's/.*\/d\/\([^/?]*\).*/\1/p')
            if [ -n "$UPD_ID" ]; then
              gdown "$UPD_ID"
            else
              gdown "${{ inputs.update_rom_url }}"
            fi
          fi

          for archive in *.zip *.7z *.rar; do
            if [ -f "$archive" ]; then
              echo "Extracting $archive..."
              7zz x "$archive" -y
              rm -f "$archive"
            fi
          done

          ls -lh "$RUNNER_TEMP/game"

      - name: Create A16 Memory-Safe Environment Config
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/a16_env.txt"
          DM_OPMODE=0
          DM_RENDER_SCALE=0.5
          DM_FPS_TARGET=30
          EOF

      - name: Compile Native iOS IPA
        run: |
          ROMFS_FLAG=""
          if [ "${{ inputs.split_romfs }}" = "true" ]; then
            ROMFS_FLAG="--romfs separate"
          fi

          ENV_FLAG=""
          if python3 scripts/build_ipa_from_nsp.py -h | grep -q -- "--env-file"; then
            ENV_FLAG="--env-file $RUNNER_TEMP/a16_env.txt"
          fi

          DM_ENV_FILE="$RUNNER_TEMP/a16_env.txt" python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" \
            -k "$RUNNER_TEMP/keys/prod.keys" \
            -o "$RUNNER_TEMP/OutputGame.ipa" \
            --app-name "${{ inputs.app_name }}" \
            $ROMFS_FLAG $ENV_FLAG

          ls -lh "$RUNNER_TEMP" "$RUNNER_TEMP/game"

      - name: Upload Compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-IPA
          path: |
            ${{ runner.temp }}/OutputGame.ipa
            ${{ runner.temp }}/game/*.ipa
          retention-days: 1

      - name: Upload Split RomFS Game Data
        if: inputs.split_romfs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-RomFS-Data
          path: |
            ${{ runner.temp }}/game/*.img
            ${{ runner.temp }}/game-work/**/RomFS*
            ${{ runner.temp }}/game-work/**/romfs*
          retention-days: 1
