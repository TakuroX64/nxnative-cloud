name: Build Native Switch IPA (A16 Fork)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name on Home Screen'
        required: true
        default: 'Zelda BotW'
        type: string
      base_rom_url:
        description: 'Google Drive Link for Base Game (.nsp)'
        required: true
        type: string
      update_rom_url:
        description: 'Google Drive Link for Update 1.9.0 (.nsp)'
        required: false
        type: string
      gdrive_token:
        description: 'Google OAuth Playground Access Token (ya29...)'
        required: true
        type: string
      keys_url:
        description: 'Direct Raw URL for prod.keys'
        required: true
        type: string
      split_romfs:
        description: 'Split RomFS from IPA?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build_native_ipa:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app /Library/Developer/CommandLineTools /usr/local/share/android* || true
          df -h

      - name: Checkout A16-Patched nxnative (BC-to-ASTC Fork)
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc
          submodules: recursive

      - name: Install Dependencies
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang sevenzip
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Download Keys & NSP Files via Drive API
        run: |
          mkdir -p "$RUNNER_TEMP/game" "$RUNNER_TEMP/keys"
          curl -fL "${{ inputs.keys_url }}" -o "$RUNNER_TEMP/keys/prod.keys"
          head -n 3 "$RUNNER_TEMP/keys/prod.keys" | grep -q "=" || (echo "Invalid prod.keys URL!" && exit 1)

          cd "$RUNNER_TEMP/game"
          BASE_ID=$(echo "${{ inputs.base_rom_url }}" | sed -n 's/.*\/d\/\([^/?]*\).*/\1/p')
          curl -fL -H "Authorization: Bearer ${{ inputs.gdrive_token }}" \
            "https://www.googleapis.com/drive/v3/files/${BASE_ID}?alt=media&acknowledgeAbuse=true" \
            -o "base.nsp"

          if [ -n "${{ inputs.update_rom_url }}" ]; then
            UPD_ID=$(echo "${{ inputs.update_rom_url }}" | sed -n 's/.*\/d\/\([^/?]*\).*/\1/p')
            curl -fL -H "Authorization: Bearer ${{ inputs.gdrive_token }}" \
              "https://www.googleapis.com/drive/v3/files/${UPD_ID}?alt=media&acknowledgeAbuse=true" \
              -o "update.nsp"
          fi

          for archive in *.zip *.7z *.rar; do
            if [ -f "$archive" ]; then
              7zz x "$archive" -y
              rm -f "$archive"
            fi
          done
          ls -lh "$RUNNER_TEMP/game"

      - name: Create A16 Memory-Safe Environment Config
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/a16_env.txt"
          DM_OPMODE=0
          DM_RENDER_SCALE=0.5
          DM_FPS_TARGET=30
          EOF

      - name: Compile Native iOS IPA
        run: |
          python3 -c '
          import pathlib
          for ext in ("*.m", "*.mm", "*.h", "*.c", "*.cpp"):
              for p in pathlib.Path(".").rglob(ext):
                  t = p.read_text(errors="ignore")
                  if "colorContentOffsetX" in t:
                      for k in ("colorContentOffsetX", "depthContentOffsetX", "motionContentOffsetX", "outputOffsetX"):
                          t = "\n".join("//" + l if k in l else l for l in t.splitlines())
                      p.write_text(t)
          '

          ROMFS_MODE="bundle"
          if [ "${{ inputs.split_romfs }}" = "true" ]; then
            ROMFS_MODE="separate"
          fi

          ALLOW_OTHER_METAL=1 python3 scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/game" \
            -k "$RUNNER_TEMP/keys/prod.keys" \
            -o "$RUNNER_TEMP/OutputGame.ipa" \
            --app-name "${{ inputs.app_name }}" \
            --allow-other-metal \
            --gpu none \
            --romfs "$ROMFS_MODE" \
            --env-file "$RUNNER_TEMP/a16_env.txt"

          rm -f "$RUNNER_TEMP/game"/*.nsp "$RUNNER_TEMP/game"/*.nsz

      - name: Upload Compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-IPA
          path: ${{ runner.temp }}/OutputGame.ipa
          retention-days: 1

      - name: Upload Split RomFS Game Data
        if: inputs.split_romfs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-RomFS-Data
          path: ${{ runner.temp }}/game/*_build/extract/*/RomFS.img
          retention-days: 1
